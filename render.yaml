services:
  - type: web
    name: silang-man1jepara
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --log-file -
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: PYTHON_VERSION
        value: 3.11.9
      # Masukkan URL database Neon / Supabase pada dashboard Render atau via env
      - key: DATABASE_URL
        sync: false
